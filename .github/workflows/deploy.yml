# GitHub Pages deploy — inherited from memory-lane (A23 there).
#
# This is the preview host, not the final one. `astro.config.mjs` carries
# `base: "/quarta-collective"` because a project site is served from a subpath; if
# the piece ever moves to a custom domain, drop the base there and this
# workflow keeps working unchanged.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these to mint a deploy token; `contents: read` is the checkout.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. A queued run supersedes an older queued one, but
# an in-flight deploy is allowed to finish rather than leaving Pages half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` builds from the lockfile. sharp compiles the 51 image variants
      # astro:assets emits, so this step is the slow one.
      - run: npm ci

      # Remote placeholder clippings are fetched and converted by sharp at
      # build, and any non-2xx from Unsplash fails the build outright. The
      # cache lives outside node_modules (astro.config `cacheDir`) so `npm ci`
      # does not wipe it; restored here, a warm build makes no image requests
      # at all. (DECISIONS Q4.)
      - uses: actions/cache@v4
        with:
          path: .astro-cache
          key: astro-cache-${{ hashFiles('package-lock.json', 'src/content/**', 'src/spreads/**', 'src/components/Clipping.astro') }}
          restore-keys: |
            astro-cache-

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
