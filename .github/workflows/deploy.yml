# GitHub Pages deploy — see DECISIONS #A23.
#
# This is the preview host, not the final one. `astro.config.mjs` carries
# `base: "/memory-lane"` because a project site is served from a subpath; if
# the piece ever moves to a custom domain, drop the base there and this
# workflow keeps working unchanged.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these to mint a deploy token; `contents: read` is the checkout.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. A queued run supersedes an older queued one, but
# an in-flight deploy is allowed to finish rather than leaving Pages half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` builds from the lockfile. sharp compiles the 51 image variants
      # astro:assets emits, so this step is the slow one.
      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
